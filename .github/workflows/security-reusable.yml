name: security-reusable

# Reusable OSS security pipeline for the druthers-* repos.
# Callers invoke this via `uses: ALeonard9/.github/.github/workflows/security-reusable.yml@main`.
# Tools: gitleaks (secrets) · semgrep CE (SAST) · trivy (SCA/container/IaC) · shellcheck.
# Output: public repos -> GitHub code scanning (Security tab); private -> SARIF artifact.
# Gate: non-blocking until `block: true`, then fails on secrets or CRITICAL/HIGH.
# Alert: on push to main, opens a deduped `security` / `priority:p1` issue on criticals.

on:
  workflow_call:
    inputs:
      stack:        { type: string,  default: "none" }        # python | node | none
      builds_image: { type: boolean, default: false }
      shellcheck:   { type: boolean, default: false }
      block:        { type: boolean, default: false }         # true = fail PR on findings
      severity:     { type: string,  default: "CRITICAL,HIGH" }
      # Extra trivy --file-patterns, e.g. 'pip:requirements/.*\.txt'. Trivy's
      # pip analyzer only recognises a file literally named requirements.txt,
      # so a repo keeping deps anywhere else scans zero packages without this.
      file_patterns: { type: string, default: "" }

permissions:
  contents: read
  security-events: write   # SARIF upload to code scanning (public repos)
  issues: write            # critical -> alert issue
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_FILE_PATTERNS: ${{ inputs.file_patterns }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare
        run: mkdir -p sarif

      # ---------- Secrets: gitleaks (full history) ----------
      - name: Gitleaks (secrets)
        run: |
          # --exit-code=0 means gitleaks returns 0 even when it finds secrets,
          # so the count below is the gate, not the exit status. A non-zero rc
          # therefore means gitleaks genuinely failed to run (image pull, docker
          # daemon, bad args). That case must not be confused with "no secrets":
          # without the report check below, a crashed scanner writes no SARIF,
          # jq falls back to 0, and the step reports "Gitleaks findings: 0" and
          # passes the block gate. Same shape as the semgrep bug fixed alongside
          # this. Gitleaks writes a report even on a clean scan, so a missing or
          # empty file means it did not run.
          rc=0
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --log-opts="--all" --redact \
            --report-format=sarif --report-path=/repo/sarif/gitleaks.sarif --exit-code=0 || rc=$?
          if [ "$rc" -ne 0 ] || [ ! -s sarif/gitleaks.sarif ]; then
            echo "::error::Gitleaks produced no report (exit $rc) - secret scanning did not run"
            if [ "${{ inputs.block }}" = "true" ]; then exit 1; fi
            echo "GITLEAKS_COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi
          n=$(jq '[.runs[].results[]] | length' sarif/gitleaks.sarif)
          echo "GITLEAKS_COUNT=$n" >> "$GITHUB_ENV"
          echo "Gitleaks findings: $n"
          # Gate on PRs only. On a push the merge already happened, so
          # failing here just paints main red; the alert step at the end of
          # this job opens a tracking issue instead.
          if [ "${{ inputs.block }}" = "true" ] \
             && [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "$n" -gt 0 ]; then
            echo "::error::$n secret(s) detected"; exit 1
          fi

      # ---------- SAST: semgrep CE (report-only) ----------
      - name: Semgrep (SAST)
        if: inputs.stack != 'none'
        run: |
          python3 -m pip install --quiet semgrep
          # Report-only is the default: semgrep exits 0 on findings unless
          # --error is passed. It is a flag, so the `--error=false` this step
          # used to carry was a usage error, and semgrep exited 2 before
          # scanning anything. `|| true` hid that, the SARIF was never written,
          # the upload below was skipped on its hashFiles() guard, and the step
          # still printed "Semgrep complete". SAST reported nothing for a month
          # while every run stayed green. Do not reintroduce a blanket `|| true`
          # here without keeping the SARIF check that follows.
          rc=0
          semgrep scan --config p/default --config p/security-audit \
            --sarif --output sarif/semgrep.sarif --quiet || rc=$?
          if [ "$rc" -ne 0 ] || [ ! -s sarif/semgrep.sarif ]; then
            echo "::error::Semgrep produced no SARIF report (exit $rc) - SAST did not run"
            if [ "${{ inputs.block }}" = "true" ]; then exit 1; fi
            exit 0
          fi
          # SARIF keeps suppressed findings and flags them, unlike --json which
          # drops them. Counting without this filter reports every `# nosemgrep`
          # line as an open finding.
          n=$(jq '[.runs[].results[] | select((.suppressions // []) | length == 0)] | length' \
                sarif/semgrep.sarif 2>/dev/null || echo 0)
          echo "Semgrep findings: $n"

          # Severity lives on the rule, and nowhere else. Semgrep SARIF results
          # carry no `level`, and unlike CodeQL its rules carry no
          # security-severity property, so the only source is
          # rule.defaultConfiguration.level. Gating on either of the other two
          # fields matches nothing and counts zero on every run, which is
          # indistinguishable from a clean scan.
          err=$(jq '[ .runs[] as $r
                      | $r.results[]
                      | select((.suppressions // []) | length == 0)
                      | .ruleId as $id
                      | select([ $r.tool.driver.rules[]?
                                 | select(.id == $id)
                                 | .defaultConfiguration.level ][0] == "error") ] | length' \
                  sarif/semgrep.sarif 2>/dev/null || echo 0)
          echo "Semgrep error-level findings: $err"
          if [ "${{ inputs.block }}" = "true" ] \
             && [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "$err" -gt 0 ]; then
            echo "::error::$err error-level semgrep finding(s). See the Security tab."
            exit 1
          fi

      # ---------- SCA + IaC + container: trivy ----------
      # Scanned once per target, to JSON, then `trivy convert` renders the
      # SARIF from that same result. The gate reads the JSON. Previously the
      # gate steps re-ran trivy over targets that had just been scanned, which
      # cost 38s a run for no new information.
      #
      # JSON rather than SARIF as the source of truth because it carries
      # FixedVersion. That is what lets the gate keep ignore-unfixed semantics:
      # block on what can actually be fixed, while the uploaded SARIF still
      # shows unfixable findings in the Security tab.
      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.2.3

      - name: Trivy fs (SCA/IaC)
        run: |
          # --list-all-pkgs so the manifest guard below reads this same result
          # instead of running its own scan.
          trivy fs --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH,MEDIUM \
            --format json --output trivy-fs.json \
            --list-all-pkgs --exit-code 0 --skip-version-check .
          trivy convert --format sarif --output sarif/trivy-fs.sarif trivy-fs.json

      # ---------- Guard: prove the SCA leg actually matched a manifest ----------
      # trivy exits 0 and reports "0 language-specific files" when it recognises
      # no dependency file, which is indistinguishable from a clean scan in the
      # check UI. For a repo that declares a stack, no packages means the scan
      # covers nothing and the green tick is meaningless.
      - name: Verify SCA matched dependency manifests
        if: inputs.stack != 'none'
        run: |
          pkgs=$(jq '[.Results[]? | select(.Class=="lang-pkgs") | .Packages | length] | add // 0' trivy-fs.json)
          echo "Dependency packages seen by trivy: $pkgs"
          if [ "${pkgs:-0}" -eq 0 ]; then
            echo "::error::trivy matched no dependency manifest for stack '${{ inputs.stack }}'"
            echo "::error::Pass file_patterns to this workflow, e.g. 'pip:requirements/.*\.txt'"
            exit 1
          fi

      # ---------- Container: build + trivy image ----------
      - name: Build image
        if: inputs.builds_image
        run: docker build -t "local/scan:${{ github.sha }}" .

      - name: Trivy image
        if: inputs.builds_image
        run: |
          trivy image --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM \
            --format json --output trivy-image.json \
            --exit-code 0 --skip-version-check "local/scan:${{ github.sha }}"
          trivy convert --format sarif --output sarif/trivy-image.sarif trivy-image.json

      # ---------- Shellcheck (infra bash) ----------
      - name: Shellcheck
        if: inputs.shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          found=$(find . -name '*.sh' -not -path './.git/*')
          if [ -n "$found" ]; then shellcheck -f gcc $found || true; fi
          echo "Shellcheck complete (report-only)"

      # ---------- Normalize SARIF (code scanning rejects undefined/null security-severity) ----------
      - name: Normalize SARIF
        run: |
          for f in sarif/*.sarif; do
            [ -f "$f" ] || continue
            sed -i 's/"security-severity": *"undefined"/"security-severity": "0.0"/g; s/"security-severity": *"null"/"security-severity": "0.0"/g' "$f"
          done

      # ---------- Publish results: one upload per tool, distinct category ----------
      # (CodeQL no longer allows multiple SARIF runs under the same category.)
      - name: Upload gitleaks SARIF
        if: ${{ !github.event.repository.private && hashFiles('sarif/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67  # v2.26.1
        with:
          sarif_file: sarif/gitleaks.sarif
          category: gitleaks

      - name: Upload semgrep SARIF
        if: ${{ !github.event.repository.private && hashFiles('sarif/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67  # v2.26.1
        with:
          sarif_file: sarif/semgrep.sarif
          category: semgrep

      - name: Upload trivy-fs SARIF
        if: ${{ !github.event.repository.private && hashFiles('sarif/trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67  # v2.26.1
        with:
          sarif_file: sarif/trivy-fs.sarif
          category: trivy-fs

      - name: Upload trivy-image SARIF
        if: ${{ !github.event.repository.private && hashFiles('sarif/trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67  # v2.26.1
        with:
          sarif_file: sarif/trivy-image.sarif
          category: trivy-image

      - name: Upload SARIF artifact (private repos)
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-sarif
          path: sarif/

      # ---------- PR gate ----------
      # PRs only: on a push the merge already happened, so failing here just
      # paints main red. The alert step below is what covers main.
      #
      # Reads the JSON from the scans above rather than re-scanning. Blocks on
      # fixable CRITICAL/HIGH only, matching the ignore-unfixed behaviour the
      # two separate gate steps used to have.
      - name: Gate - fixable CRITICAL/HIGH
        if: ${{ inputs.block && github.event_name == 'pull_request' }}
        run: |
          total=0
          for f in trivy-fs.json trivy-image.json; do
            [ -f "$f" ] || continue
            n=$(jq '[.Results[]?.Vulnerabilities[]?
                     | select(.Severity=="CRITICAL" or .Severity=="HIGH")
                     | select((.FixedVersion // "") != "")] | length' "$f")
            echo "$f: $n fixable CRITICAL/HIGH"
            total=$((total + n))
          done
          if [ "$total" -gt 0 ]; then
            echo "::error::$total fixable CRITICAL/HIGH finding(s). See the Security tab for detail."
            exit 1
          fi
          echo "No fixable CRITICAL/HIGH findings."

      # ---------- Alert: critical on main -> deduped issue ----------
      - name: Alert on critical (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Trivy maps CRITICAL/HIGH -> SARIF level "error" (severity lives on the
          # rule, not the result, so count by level instead of security-severity).
          crit=0
          for f in sarif/trivy-fs.sarif sarif/trivy-image.sarif; do
            [ -f "$f" ] || continue
            c=$(jq '[.runs[].results[] | select(.level == "error")] | length' "$f" 2>/dev/null || echo 0)
            crit=$((crit + c))
          done
          total=$((crit + ${GITLEAKS_COUNT:-0}))
          echo "Critical/high total on main: $total"
          [ "$total" -eq 0 ] && exit 0
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --label security --state open --json number -q 'length' 2>/dev/null || echo 0)
          if [ "$existing" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              --label security \
              --title "🔴 [p1] Security: $total critical/high finding(s) on main" \
              --body "Automated alert from the security workflow (commit \`${GITHUB_SHA}\`). $total CRITICAL/HIGH finding(s) across SCA/IaC/container/secrets. See the **Security → Code scanning** tab (public repos) or the run's SARIF artifact (private). Close this once triaged." \
            && echo "Opened alert issue"
          else
            echo "An open 'security' issue already exists - not duplicating."
          fi
